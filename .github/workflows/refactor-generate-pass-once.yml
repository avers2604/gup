name: Refactor generate-pass once

on:
  push:
    branches: [codex/reliability-windows-release]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/reliability-windows-release

      - name: Apply exact refactor
        run: |
          python .github/scripts/refactor-generate-pass.py
          python -m py_compile getpass_ui/app.py
          python -m pip install --quiet flake8
          flake8 getpass_ui/app.py --count --select=C901 --max-complexity=10 --statistics

      - name: Commit refactor and remove one-shot tooling
        shell: bash
        run: |
          rm .github/scripts/refactor-generate-pass.py
          rm .github/workflows/refactor-generate-pass-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add getpass_ui/app.py .github
          git commit -m "refactor: keep pass recovery below complexity gate"
          git push origin HEAD:codex/reliability-windows-release
