name: Apply reliability fixes

on:
  push:
    branches: [codex/reliability-hardening]
    paths:
      - '.github/reliability-fixes.patch'
      - '.github/workflows/apply-reliability-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/reliability-hardening
      - name: Apply patch and remove one-shot files
        run: |
          git apply --check .github/reliability-fixes.patch
          git apply .github/reliability-fixes.patch
          git rm .github/reliability-fixes.patch .github/workflows/apply-reliability-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add getpass_core/storage.py getpass_ui/app.py
          git commit -m "fix: make restore and deletion concurrency-safe"
          git push origin HEAD:codex/reliability-hardening
