# Сборка, статический анализ и тесты.
# Подробнее: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # Xvfb и библиотеки Tk нужны, чтобы прогонять проверки интерфейса
    # без монитора: именно они ловят «форма построилась, но не видна».
    - name: Install system packages for headless GUI tests
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends xvfb tk

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Lint with flake8
      run: |
        # синтаксические ошибки и обращения к неопределённым именам —
        # ровно тот класс, которым программа падала с NameError
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # остальное — предупреждениями, сборку не роняет
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        xvfb-run -a --server-args="-screen 0 1920x1200x24" python -m pytest -v
