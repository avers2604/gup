# Сборка, статический анализ и тесты.
# Подробнее: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}

    # Xvfb и библиотеки Tk нужны, чтобы прогонять проверки интерфейса
    # без монитора: именно они ловят «форма построилась, но не видна».
    - name: Install system packages for headless GUI tests
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends xvfb tk

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Lint with flake8
      run: |
        # синтаксические ошибки и обращения к неопределённым именам —
        # ровно тот класс, которым программа падала с NameError
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # остальное — предупреждениями, сборку не роняет
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        xvfb-run -a --server-args="-screen 0 1920x1200x24" python -m pytest --cov --cov-report=xml -v
    - name: Dependency audit
      run: python -m pip_audit -r requirements.txt
    - name: Security analysis
      run: python -m bandit -r getpass_core getpass_ui -lll
