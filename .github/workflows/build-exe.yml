name: Сборка .exe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Установить UPX (доп. сжатие .exe)
        run: choco install upx -y --no-progress

      # UPX сжимает сам .exe (обычно на 40-60%) — PyInstaller находит upx.exe
      # сам через PATH (choco ставит туда шим), доп. флаг не нужен.
      # Компромисс: некоторые антивирусы эвристически подозревают
      # UPX-упакованные exe (этим же приёмом пользуются вредоносы), поэтому
      # возможно ложное срабатывание Defender/SmartScreen на рабочем
      # компьютере. Если это случится — уберите шаг "Установить UPX" выше
      # и пересоберите: PyInstaller соберёт обычный (несжатый UPX) exe.
      - name: Собрать .exe
        run: pyinstaller --onefile --windowed --icon app_icon.ico pass_generator.py

      - name: Собрать папку для переноса
        shell: pwsh
        run: |
          $out = "dist\GET-Passes"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item dist\pass_generator.exe $out\
          Copy-Item app_icon.ico $out\
          if (Test-Path assets) { Copy-Item assets $out\assets -Recurse }
          if (Test-Path fonts) { Copy-Item fonts $out\fonts -Recurse }
          if (Test-Path fronts) { Copy-Item fronts $out\fronts -Recurse }
          # 7-Zip (уже есть на windows-latest) сжимает сильнее, чем
          # Compress-Archive — LZMA2 вместо Deflate
          7z a -tzip -mx=9 GET-Passes-windows.zip "$out\*"

      - name: Приложить архив к запуску (Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: GET-Passes-windows
          path: GET-Passes-windows.zip
          retention-days: 90

      - name: Обновить релиз «Последняя сборка»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Последняя сборка (${{ github.sha }})
          body: >
            Автоматическая сборка .exe из ветки main.
            Скачайте GET-Passes-windows.zip, распакуйте и запустите pass_generator.exe —
            Python на целевом компьютере не нужен.
          files: GET-Passes-windows.zip
