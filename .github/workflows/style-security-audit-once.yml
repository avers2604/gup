name: Style and security audit once

on:
  push:
    branches: [codex/reliability-hardening]
    paths:
      - '.github/workflows/style-security-audit-once.yml'

permissions:
  contents: write

jobs:
  audit-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/reliability-hardening
      - name: Install audit tools
        run: python -m pip install 'bandit>=1.9.4' 'autopep8>=2.3.2'
      - name: Report medium and high Bandit findings
        continue-on-error: true
        run: python -m bandit -r getpass_core getpass_ui -ll
      - name: Fix mechanical pycodestyle findings
        run: |
          autopep8 --in-place --recursive \
            --select=E127,E128,E231,E303,E306,E501,W292 \
            --max-line-length=127 getpass_core getpass_ui tests
          python -m compileall -q getpass_core getpass_ui tests
      - name: Commit formatting and remove one-shot workflow
        run: |
          git rm .github/workflows/style-security-audit-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add getpass_core getpass_ui tests
          git commit -m "style: normalize pycodestyle findings"
          git push origin HEAD:codex/reliability-hardening
