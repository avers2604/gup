name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
permissions:
  contents: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@c20e34f438d671fc35777cc9820dd7adf8252874
        with:
          languages: python
      - uses: github/codeql-action/analyze@c20e34f438d671fc35777cc9820dd7adf8252874
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
