name: Static cleanup once

on:
  push:
    branches:
      - codex/reliability-hardening
    paths:
      - .github/workflows/static-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/reliability-hardening
      - name: Apply exact cleanup
        run: python .github/fix_static_once.py
      - name: Verify strict static checks
        run: |
          python -m pip install flake8 bandit
          flake8 pass_generator.py getpass_core getpass_ui tests \
            --count --max-line-length=127 --show-source --statistics
          python -m bandit -r getpass_core getpass_ui -ll
          python -m compileall -q getpass_core getpass_ui tests
      - name: Commit verified cleanup
        run: |
          git rm .github/fix_static_once.py .github/workflows/static-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add getpass_core/storage.py getpass_ui/app.py
          git commit -m "style: prepare strict static checks"
          git push origin HEAD:codex/reliability-hardening
